<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marco — AI COO</title>
  <meta name="description" content="Marco — the AI COO that diagnoses your business and turns decisions into action, backed by its own CRM." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
  <link rel="stylesheet" href="css/styles.css?v=20260807c" />
</head>
<body>
  <div id="app" style="display:none">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-logo">🧭</div>
        <div class="brand-text">
          <span class="brand-name">Marco</span>
          <span class="brand-sub" data-i18n="app.tagline">AI COO</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <div class="user-chip" id="userChip"></div>
      </div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <!-- Main -->
    <div class="main">
      <div id="adminBanner"></div>
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
        <div class="topbar-title" id="topbarTitle"></div>
        <div class="topbar-actions">
          <div class="global-search">
            <span class="search-ico">🔎</span>
            <input id="globalSearch" type="search" data-i18n-ph="common.searchEverything" placeholder="Search…" />
          </div>
          <button class="icon-btn" id="langToggle" title="Language"><span id="langLabel">EN</span></button>
          <button class="icon-btn" id="themeToggle" title="Theme">🌙</button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <!-- Login screen mount point -->
  <div id="login-root" style="display:none"></div>

  <!-- Public booking widget mount point (no login required) -->
  <div id="public-root" style="display:none"></div>

  <!-- Modal + Toast mount points -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <!-- Scripts (classic scripts so the app runs over file:// with no build step) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js?v=20260807c"></script>
  <script src="js/i18n.js?v=20260807c"></script>
  <script src="js/store.js?v=20260807c"></script>
  <script src="js/ui.js?v=20260807c"></script>
  <script src="js/auth.js?v=20260807c"></script>
  <script src="js/charts.js?v=20260807c"></script>
  <script src="js/views/marco.js?v=20260807c"></script>
  <script src="js/views/dashboard.js?v=20260807c"></script>
  <script src="js/views/contacts.js?v=20260807c"></script>
  <script src="js/views/companies.js?v=20260807c"></script>
  <script src="js/views/pipeline.js?v=20260807c"></script>
  <script src="js/views/inbox.js?v=20260807c"></script>
  <script src="js/views/workflows.js?v=20260807c"></script>
  <script src="js/views/scheduling.js?v=20260807c"></script>
  <script src="js/views/settings.js?v=20260807c"></script>
  <script src="js/views/calendar-editor.js?v=20260807c"></script>
  <script src="js/views/booking.js?v=20260807c"></script>
  <script src="js/views/admin.js?v=20260807c"></script>
  <script src="js/app.js?v=20260807c"></script>
</body>
</html>
